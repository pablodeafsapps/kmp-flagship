name: Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin_checks:
    name: Detekt + Konsist (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      - name: Run Konsist
        run: ./gradlew konsist --no-daemon

  swiftlint:
    name: SwiftLint (iOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run SwiftLint via Gradle task
        run: ./gradlew swiftlint --no-daemon


